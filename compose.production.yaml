services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealguard}
      POSTGRES_USER: ${POSTGRES_USER:-dealguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - dealguard-production-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/policies:/data/policies:ro
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      ENABLE_DEMO_AUTH: "false"
      ACTION_PLANNER_ENABLED: ${ACTION_PLANNER_ENABLED:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dealguard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dealguard}
      FRONTEND_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      LOCAL_EMBEDDING_MODEL_PATH: ""
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dealguard-caddy-data:/data
      - dealguard-caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  dealguard-production-postgres:
  dealguard-caddy-data:
  dealguard-caddy-config:
