name: DealGuard CI

"on":
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: dealguard
          POSTGRES_USER: dealguard
          POSTGRES_PASSWORD: dealguard-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealguard -d dealguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: development
      ENABLE_DEMO_AUTH: "true"
      DATABASE_URL: postgresql+psycopg://dealguard:dealguard-ci-only@127.0.0.1:5432/dealguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend suite
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: dealguard_e2e
          POSTGRES_USER: dealguard
          POSTGRES_PASSWORD: dealguard-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealguard -d dealguard_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://dealguard:dealguard-ci-only@127.0.0.1:5432/dealguard_e2e
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
