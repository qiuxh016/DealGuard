services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: dealguard
      POSTGRES_USER: dealguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dealguard-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealguard -d dealguard"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dealguard-postgres:
